name: tagpr
on:
  push:
    branches: ["main"]
jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - uses: Songmu/tagpr@v1.21.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
